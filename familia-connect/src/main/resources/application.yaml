server:
  port: 8081

spring:
  application:
    name: familia-connect
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # Mostra o SQL gerado no console (útil para desenvolvimento)
    show-sql: true
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    queue-name: ${RABBITMQ_QUEUE}
    listener:
      binding-name: ${RABBITMQ_BINDING}
      exchange-name: ${RABBITMQ_EXCHANGE}
    producer:
      queue-name: ${RABBITMQ_QUEUE_RESPOSTA}
      routing-name: ${RABBITMQ_ROUTING_RESPOSTA}

app:
  storage:
    # true = salva o PDF do lote de carteirinhas localmente; false = salva em um bucket S3 da AWS
    # (o QR Code e sempre local, pois e temporario e removido logo apos a geracao da carteirinha)
    local-enabled: ${STORAGE_LOCAL_ENABLED:true}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
